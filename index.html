<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPO ERP System</title>
  
  <!-- UI Dependencies -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    .z-highest { z-index: 9999; }
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body class="bg-light">

  <!-- Global Loader -->
  <div id="global-loader" class="d-none position-fixed top-0 start-0 w-100 h-100 bg-white bg-opacity-75 z-highest d-flex justify-content-center align-items-center">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- Dynamic SPA Container -->
  <div id="app-root" class="container-fluid p-0"></div>

  <!-- Core Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <!-- App Logic -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
